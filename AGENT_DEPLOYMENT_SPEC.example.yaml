# Agent-generated, non-secret execution record for an LLM-operated deployment.
# The customer is not expected to complete this file. The agent asks a short
# guided set of questions, discovers safe values from authenticated read-only
# APIs, resolves every auto/null field, completes read-only planning, and then
# presents one complete pre-install decision packet for approval.
# Credentials and secret values must never be placed in this file.

schema_version: 5
deployment_id: auto
operation: deploy # deploy or decommission
deployment_action: new # new or resume; ignored for decommission
mode: develop_rehearsal # develop_rehearsal or stable_qualification

release:
  tag: auto_latest_develop
  public_repository: https://github.com/rapticore/ore-heaphound-deploy
  expected_source_repository: rapticore/ore_heaphound

naming:
  strategy: generated # generated, default_if_available, or customer_supplied
  prefix: ore-heaphound
  random_suffix_length: 8

authorization:
  # The agent resolves every decision and completes read-only preflight/planning
  # before asking one final deployment question. That one approval covers every
  # selected action below. The agent must not add permission stops during
  # installation unless the approved identity, plan, scope, or cost changes.
  execute_deployment: false
  # Decommission is a separate destructive operation. Deployment approval does
  # not authorize any of the following actions.
  decommission_installation: false
  override_deletion_protection: false
  delete_deployment_owned_synthetic_data: false
  delete_final_rds_snapshot_after_expiry: false
  delete_retained_custody_after_expiry: false
  delete_terraform_state_after_verification: false
  maximum_estimated_monthly_cost_usd: 0
  approved_change_reference: null
  approved_by: []

validation:
  # These are selections, not separate authorization gates. The final
  # deployment approval binds the whole resolved specification. The rapid
  # production path keeps bounded smoke on and the disruptive extensions off.
  bounded_synthetic_smoke: true
  spot_interruption: false
  fault_injection: false
  rds_restore: false
  efs_restore: false
  migration_failure: false
  synthetic_remediation: false

aws:
  # The agent discovers the active short-lived identity, shows it to the
  # customer, and records it only after confirmation.
  profile: auto_authenticated
  expected_account_id: null
  expected_installer_role_name: null
  region: us-west-2
  administrator_cidrs: []
  cluster_name: auto
  anchor_bucket: auto
  synthetic_source_bucket: auto
  synthetic_source_kms_key_arn: auto
  enable_on_demand_fallback: true
  llm_baseline_instance_types: [g6.xlarge, g5.xlarge]
  system_node_min_size: 3
  system_node_desired_size: 3
  system_node_max_size: 6
  # Generated once for a new stack. On resume/reconcile, copy the exact
  # existing map; a newer release tag does not rewrite ReleaseTag.
  infrastructure_tags: auto_from_existing_state_or_generated_once
  terraform_state:
    bucket: auto
    key: auto
    region: us-west-2
    kms_key_arn: auto
    use_lockfile: true
  # Filled from the bootstrap plan/state. It is never imported into
  # aws-central state.
  operator_secret_owner_state_key: auto

gcp:
  enabled: false
  # When selected during intake, the agent discovers the authenticated project
  # and asks the customer to confirm it.
  project_id: null
  region: us-central1
  synthetic_source_bucket: auto
  inventory_service_account: auto
  reader_service_account: auto
  aws_workload_identity_provider: auto
  deploy_remote_gke_worker: false

azure:
  enabled: false
  # When selected, the agent discovers and confirms the active tenant and
  # subscription. Existing shared networks/storage remain customer-owned.
  tenant_id: null
  subscription_id: null
  location: westus2
  resource_group_name: auto
  subnet_id: null
  source_storage_scope_ids: []
  deploy_remote_aks_worker: false

network:
  web_access: local_port_forward # local_port_forward, internal_dns, or restricted_public_tls
  web_hostname: null
  web_certificate_arn: null
  web_source_cidrs: []
  nlb_access_log_bucket: auto_from_terraform
  nlb_deletion_protection: true
  worker_gateway_hostname: null
  worker_gateway_source_cidrs: []

kubernetes:
  namespace: sddp
  prerequisite_lock: prerequisites.lock.json
  eks_kubernetes_version: auto_from_verified_lock
  eks_addon_versions: auto_from_verified_lock
  kyverno_chart_version: auto_from_verified_lock
  aws_load_balancer_controller_chart_version: auto_from_verified_lock
  external_secrets_chart_version: auto_from_verified_lock
  nvidia_device_plugin_chart_version: auto_from_verified_lock
  karpenter_ami_alias: auto_from_verified_lock
  customer_values_file: auto_private_workdir

model:
  model_reference: auto_from_verified_model_lock
  model_sha256: auto_from_verified_model_lock
  model_lock: model.lock.json
  # License/source data is inventory from the signed lock, not a customer
  # acceptance gate or a separate deployment authorization.
  license_expression: auto_from_verified_model_lock
  source_reference: auto_from_verified_model_lock
  runtime_published_sub_path: store
  runtime_read_only: true
  prompt_version: null
  # Use the exact upstream source locked by the signed release.
  staging_source_reference: auto_from_verified_model_lock

secrets:
  # The agent proposes dedicated generated references or records existing
  # customer references. It never prints or stores their secret values here.
  delivery_method: auto
  controller_namespace: external-secrets
  operator_secret_reference: auto
  operator_secret_terraform_owner: bootstrap_state
  web_tls_secret_reference: null
  gateway_tls_secret_reference: null

synthetic_test:
  corpus_id: auto
  corpus_revision: auto
  expected_inventory_sha256: auto_after_generation
  target_size_gib: 100

qualification:
  target_id: auto
  evidence_retention_days: 365
  input_bucket: auto
  input_prefix: ore-heaphound/qualification-input
  archive_bucket: auto
  archive_prefix: ore-heaphound/qualification
  finalization_requested: false

decommission:
  # Keep this block inactive for deployment. During a removal interview, the
  # agent records the prior readiness report and a new approval that names the
  # exact account, project, cluster, and state key.
  mode: operational # operational or full_after_retention
  deployment_readiness_report: null
  approved_change_reference: null
  approved_by: []
  require_final_rds_snapshot: true
  expected_final_rds_snapshot_identifier: auto
  report_destination: null

intake:
  generated_by_agent: true
  customer_answers_recorded: false
  pre_install_decisions_complete: false
  decision_packet_sha256: null
  resolved_specification_sha256: null

approvals:
  # The deployment record binds the complete pre-install decision packet,
  # exact saved plan (or bootstrap plan plus strict central-plan contract),
  # selected optional tests, maximum cost, approver, and timestamp.
  deployment: null
  # Removal is always a later destructive operation with its own exact plan.
  decommission: null
