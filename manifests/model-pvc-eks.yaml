# Replace the EFS fileSystemId with the aws-central output before applying.
# The one-time staging Job mounts the claim root read-write and atomically
# publishes the verified store/ directory. Runtime pods mount only store/
# read-only; ReadWriteMany is a topology capability, not the write-protection
# mechanism.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: REPLACE_EFS_FILE_SYSTEM_ID
  directoryPerms: "0750"
mountOptions: [tls]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sddp-models-rox
  namespace: sddp
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 20Gi
