production:
  enabled: true
  # Keep two inference replicas warm: one on the managed GPU baseline and one
  # on the elastic LLM pool. Scan workers fail closed when contextual detection
  # is enabled, so this removes the single-pod startup dependency.
  ollamaBaselineReplicas: 2

networkPolicy:
  enabled: true
  vpcCIDR: REPLACE_VPC_CIDR
  externalHTTPSCIDRs: [0.0.0.0/0]
  publicIngressCIDRs: [REPLACE_PUBLIC_CLIENT_CIDR]

image:
  registry: public.ecr.aws
  repository: n7r3j2c0/ore-heaphound
  digest: sha256:cddac933a86f39d12263b42df4c5e8d9049a90976f03db7f569e12e9127ef022

extraction:
  enabled: true
  denyEgress: true
  autoscaling:
    # Mixed-content scans need the parser tier already warm; express this in
    # signed values rather than relying on the current operational hold.
    minReplicas: 60
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  image:
    repository: public.ecr.aws/n7r3j2c0/ore-heaphound-tika
    digest: sha256:552348d406d8faa1830ec63cd5d315d27f0fb6fbaec4abf83c4fa2dde386fdd0

existingSecret: sddp-production-operator-secrets
generatedSecret: sddp-production-generated

database:
  migrationJob:
    # Covers an External Secrets refresh if RDS rotation races the Helm hook.
    backoffLimit: 8
    credentialMode: components
    databaseName: sddp
  runtimeRole: sddp_runtime
  webRole: sddp_web
  verificationRole: sddp_verification_preview

security:
  allowGlobalResourceAccess: true

anchors:
  bucket: REPLACE_ANCHOR_BUCKET
  lockMode: compliance
  retention: 8760h

controlPlane:
  replicas: 3
  databasePool:
    maxConnections: 16
    minConnections: 2
  rollout:
    maxUnavailable: 1
    maxSurge: 0
  staticAuth:
    enabled: true

verificationPreview:
  enabled: true
  replicas: 2
  grantTTL: 60s
  maxSamples: 3
  hardMaxSamples: 10

web:
  enabled: true
  replicas: 3
  rollout:
    maxUnavailable: 1
    maxSurge: 0
  managedUsers: true
  secureCookie: true
  baseURL: https://REPLACE_APPLICATION_HOST
  publicService:
    enabled: true
    hostname: REPLACE_APPLICATION_HOST
    certificateArn: REPLACE_ACM_CERTIFICATE_ARN
    loadBalancerSourceRanges: [REPLACE_PUBLIC_CLIENT_CIDR]
    accessLogBucket: REPLACE_ACCESS_LOG_BUCKET
  mfa:
    enabled: true
    requiredRoles: admin,approver

scanWorkers:
  sharding:
    enabled: true
    # Split large newline-oriented exports before one lease owns minutes of
    # work. v2 changes the immutable work identity; already-enqueued v1 work
    # remains executable while new scans use 16-MiB independently retryable
    # ranges with a bounded ownership overlap.
    version: format-ranges-v2
    thresholdBytes: 67108864
    targetBytes: 16777216
    overlapBytes: 262144
  rulesetVersion: native:builtin-v11|kingfisher:1.106.0|presidio:2.2.362|default-recognizers|spacy-en_core_web_lg|contextual:qwen2.5:7b-instruct|phi-span-prompt:v4|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  detectorManifestDigest: sha256:44a8ae86efe6dcaa44a15c26c758df36cf6b437aa9b62b31a2afc60cc28a511f
  contextualEngine:
    enabled: true
    model: qwen2.5:7b-instruct
    modelDigest: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
    version: qwen2.5:7b-instruct|phi-span-prompt:v4|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  presidioEngine:
    enabled: true
    local: true
    version: 2.2.362|default-recognizers|spacy-en_core_web_lg
    language: en
    scoreThreshold: "0.65"
  secretEngine:
    enabled: true
    version: 1.106.0
  keda:
    enabled: true
    maxReplicas: 200
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: rapticore.io/capacity
                operator: In
                values: [spot]

# The platform proposes and audits a worker plan from each scan's deadline and
# spend cap. Calibrate the inherited catalog during staging qualification.
capacityAdvisor:
  enabled: true
  # The base chart carries the matching versioned presidio50 catalog. Keep the
  # production ceiling explicit here so release reconciliation cannot inherit
  # a future generic default.
  stageMaxReplicas:
    tika: 60
    presidio: 50
  # Carry the complete profile list in the signed production values. Helm
  # replaces lists, and relying on generic chart defaults here previously let a
  # later overlay restore the obsolete Presidio 20 ceiling.
  catalog:
    version: builtin-balanced-m8a-v6-stage-aware-tika60-presidio50
    profiles:
      - id: small
        stage: scan
        capacity_class: small
        throughput_bytes_per_hour: 1073741824
        throughput_objects_per_hour: 20000
        hourly_cost_microusd: 120000
        min_replicas: 0
        max_replicas: 120
      - id: standard
        stage: scan
        capacity_class: standard
        throughput_bytes_per_hour: 2147483648
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 280000
        min_replicas: 1
        max_replicas: 8
      - id: large
        stage: scan
        capacity_class: large
        throughput_bytes_per_hour: 3221225472
        throughput_objects_per_hour: 500
        hourly_cost_microusd: 750000
        min_replicas: 0
        max_replicas: 20
      - id: tika
        stage: extraction
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 2000
        hourly_cost_microusd: 220000
        min_replicas: 1
        max_replicas: 60
      - id: presidio
        stage: entity_recognition
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 240000
        min_replicas: 0
        max_replicas: 50
      - id: qwen
        stage: contextual
        capacity_class: gpu
        throughput_bytes_per_hour: 6442450944
        throughput_objects_per_hour: 1000
        hourly_cost_microusd: 1100000
        min_replicas: 0
        max_replicas: 8

presidio:
  enabled: true
  workers: "2"
  gunicornArgs: "--timeout 300 --graceful-timeout 300"
  image:
    repository: ghcr.io/data-privacy-stack/presidio-analyzer
    tag: 2.2.362
    digest: sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
  autoscaling:
    # Qualified directly in production on 2026-08-11. Two Gunicorn workers per
    # pod provide 100 analyzer execution slots while Tika remains independently
    # held for the mixed-content workload.
    minReplicas: 50
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule

localModels:
  ollama:
    enabled: true
    models: [qwen2.5:7b-instruct]
    modelPull: { enabled: false }
    # Two inference slots on each of two pods preserve four-way concurrency
    # without concentrating every prompt cache on one GPU pod.
    numParallel: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
    persistence:
      enabled: true
      existingClaim: sddp-models-rox
      readOnly: true
      subPath: store
      accessModes: [ReadWriteMany]
    acceleratorResources: { nvidia.com/gpu: 1 }
    nodeSelector: { rapticore.io/workload: llm }
    tolerations:
      - key: rapticore.io/workload
        operator: Equal
        value: llm
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: rapticore.io/capacity
                  operator: In
                  # Keep a stable endpoint on the fixed managed GPU baseline.
                  # The second baseline replica and later elastic replicas can
                  # consume the Spot-only llm NodePool.
                  values: [on-demand]

resilience:
  podDisruptionBudgets:
    enabled: true
    apiMinAvailable: 2
    webMinAvailable: 2
    extractionMinAvailable: 1
    presidioMinAvailable: 1
    verificationMinAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule

config:
  aws:
    region: REPLACE_AWS_REGION

serviceAccount:
  controlPlane:
    name: sddp-control-plane
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_CONTROL_PLANE_ROLE_ARN
  scanWorker:
    name: sddp-scan-worker
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_SCAN_WORKER_ROLE_ARN
  verificationPreview:
    name: sddp-verification-preview
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_VERIFICATION_PREVIEW_ROLE_ARN
