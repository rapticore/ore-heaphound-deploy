production:
  enabled: true

networkPolicy:
  enabled: true
  vpcCIDR: REPLACE_VPC_CIDR
  externalHTTPSCIDRs: [0.0.0.0/0]
  publicIngressCIDRs: [REPLACE_PUBLIC_CLIENT_CIDR]

image:
  registry: public.ecr.aws
  repository: n7r3j2c0/ore-heaphound
  digest: sha256:9c81d3145baa965f559c280ea564447afc22ed918af1db4a67122e97ef52c315

extraction:
  enabled: true
  denyEgress: true
  autoscaling:
    minReplicas: 2
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  image:
    repository: public.ecr.aws/n7r3j2c0/ore-heaphound-tika
    digest: sha256:29a5ff256e9a543ecc687a8156a84c244b3488fce73cc9c94f98e9fcfc4a2917

existingSecret: sddp-production-operator-secrets
generatedSecret: sddp-production-generated

database:
  runtimeRole: sddp_runtime
  webRole: sddp_web
  verificationRole: sddp_verification_preview

security:
  allowGlobalResourceAccess: true

anchors:
  bucket: REPLACE_ANCHOR_BUCKET
  lockMode: compliance
  retention: 8760h

controlPlane:
  replicas: 3
  staticAuth:
    enabled: true

verificationPreview:
  enabled: true
  replicas: 2
  grantTTL: 60s
  maxSamples: 3
  hardMaxSamples: 10

web:
  enabled: true
  replicas: 3
  managedUsers: true
  secureCookie: true
  baseURL: https://REPLACE_APPLICATION_HOST
  publicService:
    enabled: true
    hostname: REPLACE_APPLICATION_HOST
    certificateArn: REPLACE_ACM_CERTIFICATE_ARN
    loadBalancerSourceRanges: [REPLACE_PUBLIC_CLIENT_CIDR]
    accessLogBucket: REPLACE_ACCESS_LOG_BUCKET
  mfa:
    enabled: true
    requiredRoles: admin,approver

scanWorkers:
  sharding:
    enabled: true
  rulesetVersion: native:builtin-v6|kingfisher:1.106.0|presidio:2.2.362|default-recognizers|spacy-en_core_web_lg|contextual:qwen2.5:7b-instruct|phi-span-prompt:v3|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  detectorManifestDigest: sha256:a7e9b38da96f2e029dc08e4187b485f19cbe1bfa987130eb52e6b77f642f0873
  contextualEngine:
    enabled: true
    model: qwen2.5:7b-instruct
    modelDigest: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
    version: qwen2.5:7b-instruct|phi-span-prompt:v3|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  presidioEngine:
    enabled: true
    local: true
    version: 2.2.362|default-recognizers|spacy-en_core_web_lg
    language: en
    scoreThreshold: "0.65"
  secretEngine:
    enabled: true
    version: 1.106.0
  keda:
    enabled: true
    maxReplicas: 200
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: rapticore.io/capacity
                operator: In
                values: [spot]

# The platform proposes and audits a worker plan from each scan's deadline and
# spend cap. Calibrate the inherited catalog during staging qualification.
capacityAdvisor:
  enabled: true

presidio:
  enabled: true
  image:
    repository: ghcr.io/data-privacy-stack/presidio-analyzer
    tag: 2.2.362
    digest: sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
  autoscaling:
    minReplicas: 1
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule

localModels:
  ollama:
    enabled: true
    models: [qwen2.5:7b-instruct]
    modelPull: { enabled: false }
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
    persistence:
      enabled: true
      existingClaim: sddp-models-rox
      readOnly: true
      subPath: store
      accessModes: [ReadWriteMany]
    acceleratorResources: { nvidia.com/gpu: 1 }
    nodeSelector: { rapticore.io/workload: llm }
    tolerations:
      - key: rapticore.io/workload
        operator: Equal
        value: llm
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: rapticore.io/capacity
                  operator: In
                  # Keep one stable model endpoint on the fixed managed GPU
                  # baseline. Replicas 2+ consume the Spot-only llm NodePool.
                  values: [on-demand]

resilience:
  podDisruptionBudgets:
    enabled: true
    apiMinAvailable: 2
    webMinAvailable: 2
    extractionMinAvailable: 1
    verificationMinAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule

config:
  aws:
    region: REPLACE_AWS_REGION

serviceAccount:
  controlPlane:
    name: sddp-control-plane
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_CONTROL_PLANE_ROLE_ARN
  scanWorker:
    name: sddp-scan-worker
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_SCAN_WORKER_ROLE_ARN
  verificationPreview:
    name: sddp-verification-preview
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_VERIFICATION_PREVIEW_ROLE_ARN
