production:
  enabled: true

networkPolicy:
  enabled: true
  vpcCIDR: REPLACE_VPC_CIDR
  externalHTTPSCIDRs: [0.0.0.0/0]
  publicIngressCIDRs: [REPLACE_PUBLIC_CLIENT_CIDR]

image:
  registry: public.ecr.aws
  repository: n7r3j2c0/ore-heaphound
  digest: sha256:beb2551c15262dbd64fddb59c29a75661b946ccc5697ad968a30087d9574e48b

extraction:
  enabled: true
  denyEgress: true
  image:
    repository: public.ecr.aws/n7r3j2c0/ore-heaphound-tika
    digest: sha256:7447d77c79860a81509116b241da832b7a019d07be54f3b139d7caf06465cd8a

existingSecret: sddp-production-operator-secrets
generatedSecret: sddp-production-generated

database:
  runtimeRole: sddp_runtime
  webRole: sddp_web

security:
  allowGlobalResourceAccess: true

anchors:
  bucket: REPLACE_ANCHOR_BUCKET
  lockMode: compliance
  retention: 8760h

controlPlane:
  staticAuth:
    enabled: true

web:
  enabled: true
  managedUsers: true
  secureCookie: true
  baseURL: https://REPLACE_APPLICATION_HOST
  publicService:
    enabled: true
    hostname: REPLACE_APPLICATION_HOST
    certificateArn: REPLACE_ACM_CERTIFICATE_ARN
    loadBalancerSourceRanges: [REPLACE_PUBLIC_CLIENT_CIDR]
    accessLogBucket: REPLACE_ACCESS_LOG_BUCKET
  mfa:
    enabled: true
    requiredRoles: admin,approver

scanWorkers:
  rulesetVersion: native:builtin-v6|kingfisher:1.106.0|contextual:qwen2.5:7b-instruct|phi-span-prompt:v3|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  detectorManifestDigest: sha256:97611f1790b857178a1b249d797b7f759408e03b7d9dda56de0e500f100e69a3
  contextualEngine:
    enabled: true
    model: qwen2.5:7b-instruct
    modelDigest: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
    version: qwen2.5:7b-instruct|phi-span-prompt:v3|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  secretEngine:
    enabled: true
    version: 1.106.0
  keda:
    enabled: true
  nodeSelector:
    rapticore.io/workload: scan
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: rapticore.io/capacity
                operator: In
                values: [spot]

localModels:
  ollama:
    enabled: true
    models: [qwen2.5:7b-instruct]
    modelPull: { enabled: false }
    autoscaling: { enabled: true }
    persistence:
      enabled: true
      existingClaim: sddp-models-rox
      readOnly: true
      subPath: store
      accessModes: [ReadWriteMany]
    acceleratorResources: { nvidia.com/gpu: 1 }
    nodeSelector: { rapticore.io/workload: llm }
    tolerations:
      - key: rapticore.io/workload
        operator: Equal
        value: llm
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: rapticore.io/capacity
                  operator: In
                  values: [spot]

config:
  aws:
    region: REPLACE_AWS_REGION

serviceAccount:
  controlPlane:
    name: sddp-control-plane
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_CONTROL_PLANE_ROLE_ARN
  scanWorker:
    name: sddp-scan-worker
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_SCAN_WORKER_ROLE_ARN
