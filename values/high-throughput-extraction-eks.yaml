# Optional additive overlay for a production installation where extraction
# throughput is more valuable than idle-cost minimization. Apply this after
# values/central-eks.yaml and before the customer-private overlay.
#
# If the customer-private overlay replaces capacityAdvisor.catalog.profiles,
# preserve the complete profile list and keep the Tika and Presidio profile
# ceilings aligned with stageMaxReplicas. Helm replaces lists rather than
# merging profile entries.
extraction:
  autoscaling:
    # The active production fleet is intentionally held at sixty for the
    # upcoming mixed-content workload. Make that posture release-owned.
    minReplicas: 60
  resources:
    # The live 4-core pods were pinned at their CPU limit while memory settled
    # near 12 GiB. Fewer, wider parser JVMs reduce request queues and duplicate
    # JVM/model overhead; the request is intentionally schedulable on the
    # qualified 8/16/32-vCPU scan families.
    requests: { cpu: "6", memory: "12Gi" }
    limits: { cpu: "8", memory: "16Gi" }

capacityAdvisor:
  stageMaxReplicas:
    # Keep the proven 60-replica Tika mixed-content baseline.
    # The earlier twenty-replica Presidio ceiling became the production
    # bottleneck after full 128-MiB entity-recognition coverage. Fifty replicas
    # were qualified in production with zero restarts/dead letters and about a
    # threefold completed-object improvement.
    tika: 60
    presidio: 50
  catalog:
    version: builtin-balanced-m8a-v6-stage-aware-tika60-presidio50
    profiles:
      - id: small
        stage: scan
        capacity_class: small
        throughput_bytes_per_hour: 1073741824
        throughput_objects_per_hour: 20000
        hourly_cost_microusd: 120000
        min_replicas: 0
        max_replicas: 120
      - id: standard
        stage: scan
        capacity_class: standard
        throughput_bytes_per_hour: 2147483648
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 280000
        min_replicas: 1
        max_replicas: 8
      - id: large
        stage: scan
        capacity_class: large
        throughput_bytes_per_hour: 3221225472
        throughput_objects_per_hour: 500
        hourly_cost_microusd: 750000
        min_replicas: 0
        max_replicas: 20
      - id: tika
        stage: extraction
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 2000
        hourly_cost_microusd: 220000
        min_replicas: 1
        max_replicas: 60
      - id: presidio
        stage: entity_recognition
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 240000
        min_replicas: 0
        max_replicas: 50
      - id: qwen
        stage: contextual
        capacity_class: gpu
        throughput_bytes_per_hour: 6442450944
        throughput_objects_per_hour: 1000
        hourly_cost_microusd: 1100000
        min_replicas: 0
        max_replicas: 8

presidio:
  # The direct production repair fixed both bounds at fifty. Preserve that
  # floor in the signed values so Helm cannot scale the analyzer tier back to
  # the former saturated state during the next release.
  autoscaling:
    minReplicas: 50
