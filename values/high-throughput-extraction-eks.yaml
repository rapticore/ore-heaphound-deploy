# Optional additive overlay for a production installation where extraction
# throughput is more valuable than idle-cost minimization. Apply this after
# values/central-eks.yaml and before the customer-private overlay.
#
# If the customer-private overlay replaces capacityAdvisor.catalog.profiles,
# preserve the complete profile list and keep the Tika and Presidio profile
# ceilings aligned with stageMaxReplicas. Helm replaces lists rather than
# merging profile entries.
extraction:
  autoscaling:
    minReplicas: 24
  resources:
    # Production Tika pods consumed close to the 2-core limit. Reserve most of
    # that demand so the scheduler does not CPU-overpack extraction nodes.
    requests: { cpu: "1500m", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }

capacityAdvisor:
  stageMaxReplicas:
    # Keep the proven 24-replica baseline. Forty is the smallest bounded
    # headroom above the observed 32-replica saturation point, and Presidio is
    # allowed to scale with the same input stream instead of becoming the next
    # fixed bottleneck.
    tika: 40
    presidio: 40
  catalog:
    version: builtin-balanced-m8a-v4-tika40-presidio40
    profiles:
      - id: small
        stage: scan
        capacity_class: small
        throughput_bytes_per_hour: 1073741824
        throughput_objects_per_hour: 20000
        hourly_cost_microusd: 120000
        min_replicas: 0
        max_replicas: 120
      - id: standard
        stage: scan
        capacity_class: standard
        throughput_bytes_per_hour: 2147483648
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 280000
        min_replicas: 1
        max_replicas: 8
      - id: large
        stage: scan
        capacity_class: large
        throughput_bytes_per_hour: 3221225472
        throughput_objects_per_hour: 500
        hourly_cost_microusd: 750000
        min_replicas: 0
        max_replicas: 20
      - id: tika
        stage: extraction
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 2000
        hourly_cost_microusd: 220000
        min_replicas: 1
        max_replicas: 40
      - id: presidio
        stage: entity_recognition
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 240000
        min_replicas: 0
        max_replicas: 40
      - id: qwen
        stage: contextual
        capacity_class: gpu
        throughput_bytes_per_hour: 6442450944
        throughput_objects_per_hour: 1000
        hourly_cost_microusd: 1100000
        min_replicas: 0
        max_replicas: 8
