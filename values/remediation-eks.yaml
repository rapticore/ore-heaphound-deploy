# Explicit governed-remediation overlay for the production EKS values.
# Do not include this file for discovery-and-triage-only deployments; keep
# remediation_enabled=false in Terraform in that mode.

serviceAccount:
  remediationExecutor:
    name: sddp-remediation-executor
    annotations:
      # Terraform output: remediation_executor_role_arn.
      eks.amazonaws.com/role-arn: REPLACE_REMEDIATION_EXECUTOR_ROLE_ARN

# This overlay deliberately does not lower the central deployment's Ollama
# baseline. Deterministic and Presidio redaction do not depend on Ollama, while
# contextual scan detection and explicitly selected guarded-AI validation use
# the production baseline configured by central-eks.yaml.

# Nothing here can act on its own. Ordinary remediation is request -> rendered
# dry run -> digest-bound approval -> revalidation -> execution -> verification
# and retains its rollbackWindow snapshot. The high-throughput snapshot workflow
# instead binds exact scanned versions, selected classes, the chosen engine,
# per-item strategies, and removal fallbacks before two approvals; it renders only
# after approval, conditionally mutates the attested staged prefix, and then
# verifies a fresh exact inventory. It creates no extra dataset or rollback copy.
remediation:
  enabled: true
  planFirstRedaction:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 50
    cooldownPeriod: 300
  # First-class staged-snapshot classification, in-place redaction, exclusion,
  # and fresh verification. The chart keeps this opt-in; this production
  # remediation overlay supplies every required write/scratch dependency below.
  intelligenceGoals:
    enabled: true
  # The scan Karpenter NodePool uses the deployment EC2NodeClass whose 100 GiB
  # gp3 root volume is encrypted. A 60 GiB request leaves capacity outside the
  # 50 GiB scratch volume for image layers, logs, and Kubernetes bookkeeping.
  nodeSelector:
    rapticore.io/workload: scan
    rapticore.io/scratch-capacity-policy: aws-central-karpenter-encrypted-root-v1
  tolerations:
    - key: rapticore.io/workload
      operator: Equal
      value: scan
      effect: NoSchedule
  resources:
    requests:
      ephemeral-storage: 60Gi
    limits:
      ephemeral-storage: 60Gi
  # Rollback snapshots. Terraform output: quarantine_bucket.
  quarantineBucket: REPLACE_QUARANTINE_BUCKET
  # Dedicated least-privilege database role; production refuses a shared role.
  databaseRole: sddp_executor
  approvalTTL: 24h
  # Terraform output: remediation_rollback_window. Keeping these equal prevents
  # infrastructure lifecycle from expiring a still-authorized rollback.
  rollbackWindow: REPLACE_REMEDIATION_ROLLBACK_WINDOW
  aws:
    region: REPLACE_AWS_REGION
  redaction:
    enabled: true
    scratch:
      encrypted: true
      capacityPolicyId: aws-central-karpenter-encrypted-root-v1
    # The UI defaults to Presidio operator agreement. Deterministic remains an
    # always-available baseline; AI adds a local fail-closed residual review
    # only when explicitly selected for a request.
    engines: [deterministic_v1, presidio_v1, ai_guarded_v1]
    provider: s3
    # Redacted copies. Terraform output: redacted_bucket.
    redactedBucket: REPLACE_REDACTED_BUCKET
    # Terraform output: data_kms_key_arn.
    destinationEncryptionKey: REPLACE_DATA_KMS_KEY_ARN
    # Your versioned identifier for the externally enforced destination
    # controls (account/region, encryption, retention, residency). Change it
    # whenever those controls change; it is bound into every approval.
    destinationPolicyId: REPLACE_DESTINATION_POLICY_ID
    presidioAnonymizer:
      enabled: true
      replicas: 2
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 25
        cooldownPeriod: 300
        cpuTargetUtilization: 70
      workers: 2
      timeoutSeconds: 300
      gracefulTimeoutSeconds: 300
      requestTimeoutSeconds: 330
    llmValidation:
      enabled: true
      provider: ollama
      model: qwen2.5:7b-instruct
      modelDigest: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
      version: qwen2.5:7b-instruct|phi-span-prompt:v5|model:sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e|redaction-validator:v4
      dataPolicyId: private-local-redaction-validation-v1
