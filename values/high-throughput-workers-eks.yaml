# Optional additive overlay for a bounded 143-pod scan-worker baseline with
# requests calibrated from a live production utilization sample.
#
# Helm replaces lists, so this file intentionally contains the complete worker
# pool list. Apply it after values/central-eks.yaml and before any
# customer-private overlay. If the private overlay also defines workerPools,
# carry these minima into that complete list.
capacityAdvisor:
  workerPools:
    - name: small
      capacityClass: small
      minReplicas: 120
      maxReplicas: 120
      concurrency: 4
      placements: []
      resources:
        requests: { cpu: "100m", memory: "256Mi" }
        limits: { cpu: "2", memory: "2Gi" }
    - name: standard
      capacityClass: standard
      minReplicas: 8
      maxReplicas: 8
      concurrency: 4
      placements: []
      resources:
        requests: { cpu: "1500m", memory: "1536Mi" }
        limits: { cpu: "4", memory: "8Gi" }
    - name: large
      capacityClass: large
      minReplicas: 15
      maxReplicas: 20
      concurrency: 2
      placements: []
      resources:
        # Large workers were idle during the sizing sample. Preserve the
        # reviewed 16-GiB memory reservation until an active large-object peak
        # proves a lower value is safe.
        requests: { cpu: "2", memory: "16Gi" }
        limits: { cpu: "8", memory: "32Gi" }
  catalog:
    version: builtin-balanced-m8a-v3-tika32
    profiles:
      - id: small
        stage: scan
        capacity_class: small
        throughput_bytes_per_hour: 1073741824
        throughput_objects_per_hour: 20000
        hourly_cost_microusd: 120000
        min_replicas: 0
        max_replicas: 120
      - id: standard
        stage: scan
        capacity_class: standard
        throughput_bytes_per_hour: 2147483648
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 280000
        min_replicas: 1
        max_replicas: 8
      - id: large
        stage: scan
        capacity_class: large
        throughput_bytes_per_hour: 3221225472
        throughput_objects_per_hour: 500
        hourly_cost_microusd: 750000
        min_replicas: 0
        max_replicas: 20
      - id: tika
        stage: extraction
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 2000
        hourly_cost_microusd: 220000
        min_replicas: 1
        max_replicas: 32
      - id: presidio
        stage: entity_recognition
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 240000
        min_replicas: 0
        max_replicas: 20
      - id: qwen
        stage: contextual
        capacity_class: gpu
        throughput_bytes_per_hour: 6442450944
        throughput_objects_per_hour: 1000
        hourly_cost_microusd: 1100000
        min_replicas: 0
        max_replicas: 8

# These services were using more than their previous requests. Raising the
# requests makes packing truthful without changing limits or replica ceilings.
presidio:
  resources:
    requests: { cpu: "1", memory: "1280Mi" }
    limits: { cpu: "2", memory: "2Gi" }

localModels:
  ollama:
    resources:
      requests: { cpu: "2500m", memory: "11Gi" }
      limits: { cpu: "4", memory: "12Gi" }
