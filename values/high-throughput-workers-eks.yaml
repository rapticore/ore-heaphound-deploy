# Optional additive overlay for scan-worker ceilings and requests calibrated
# from a live production utilization sample. Low warm floors plus KEDA demand
# and CPU pressure avoid reserving the full 143-pod envelope while it is idle.
#
# Helm replaces lists, so this file intentionally contains the complete worker
# pool list. Apply it after values/central-eks.yaml and before any
# customer-private overlay. If the private overlay also defines workerPools,
# carry these minima into that complete list.
capacityAdvisor:
  workerPools:
    - name: small
      capacityClass: small
      # This is a concurrency floor, not an idle-capacity target: these workers
      # wait on Presidio and therefore do not expose useful CPU pressure.
      minReplicas: 25
      maxReplicas: 120
      concurrency: 4
      placements: []
      resources:
        # Qualified against the production OOM incident with concurrency kept
        # at four: reserve 1 GiB and allow a bounded 4-GiB peak per worker.
        requests: { cpu: "100m", memory: "1Gi" }
        limits: { cpu: "2", memory: "4Gi" }
    - name: standard
      capacityClass: standard
      minReplicas: 1
      maxReplicas: 8
      concurrency: 4
      placements: []
      resources:
        requests: { cpu: "1500m", memory: "1536Mi" }
        limits: { cpu: "4", memory: "8Gi" }
    - name: large
      capacityClass: large
      minReplicas: 0
      maxReplicas: 20
      concurrency: 2
      placements: []
      resources:
        # The accompanying application release lets large workers spill down
        # into standard and small work when their own band is empty. Keep this
        # tested baseline only with that release; v0.1.0-develop.22 must use a
        # zero large minimum. Preserve the reviewed 16-GiB reservation until an
        # active large-object peak proves a lower value is safe.
        requests: { cpu: "2", memory: "16Gi" }
        limits: { cpu: "8", memory: "32Gi" }
  catalog:
    version: builtin-balanced-m8a-v6-stage-aware-tika60-presidio50
    profiles:
      - id: small
        stage: scan
        capacity_class: small
        throughput_bytes_per_hour: 1073741824
        throughput_objects_per_hour: 20000
        hourly_cost_microusd: 120000
        min_replicas: 0
        max_replicas: 120
      - id: standard
        stage: scan
        capacity_class: standard
        throughput_bytes_per_hour: 2147483648
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 280000
        min_replicas: 1
        max_replicas: 8
      - id: large
        stage: scan
        capacity_class: large
        throughput_bytes_per_hour: 3221225472
        throughput_objects_per_hour: 500
        hourly_cost_microusd: 750000
        min_replicas: 0
        max_replicas: 20
      - id: tika
        stage: extraction
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 2000
        hourly_cost_microusd: 220000
        min_replicas: 1
        max_replicas: 60
      - id: presidio
        stage: entity_recognition
        capacity_class: standard
        throughput_bytes_per_hour: 8589934592
        throughput_objects_per_hour: 5000
        hourly_cost_microusd: 240000
        min_replicas: 0
        max_replicas: 50
      - id: qwen
        stage: contextual
        capacity_class: gpu
        throughput_bytes_per_hour: 6442450944
        throughput_objects_per_hour: 1000
        hourly_cost_microusd: 1100000
        min_replicas: 0
        max_replicas: 8

# These services were using more than their previous requests. Raising the
# requests makes packing truthful; the extraction overlay carries the matching
# Tika and Presidio stage ceilings and complete capacity catalog.
presidio:
  autoscaling:
    # Repeat the elastic HA floor because this overlay is rendered after the
    # extraction overlay. CPU pressure retains the 50-pod busy envelope.
    minReplicas: 3
  resources:
    # en_core_web_lg is roughly 800 MiB before request-serving overhead. The
    # prior 1280-MiB reservation left too little measured runtime headroom.
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }

localModels:
  ollama:
    resources:
      requests: { cpu: "2500m", memory: "11Gi" }
      limits: { cpu: "4", memory: "12Gi" }
